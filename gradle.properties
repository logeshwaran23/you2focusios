# ===================================================================
# MEMORY SETTINGS
# ===================================================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# ===================================================================
# BUILD PERFORMANCE
# ===================================================================
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configureondemand=false

# ===================================================================
# ANDROIDX & KOTLIN
# ===================================================================
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
# Faster incremental compilation ? only recompiles changed class bytecode
kotlin.incremental.useClasspathSnapshot=true

# Faster R class resolution in release
android.nonFinalResIds=true


# ===================================================================
# ANDROID BUILD OPTIMIZATIONS
# ===================================================================
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# ===================================================================
# COMPILE & BUILD SETTINGS
# ===================================================================
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true

# ===================================================================
# R8
# ===================================================================
android.enableR8.fullMode=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true

# ===================================================================
# MISC
# ===================================================================
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
